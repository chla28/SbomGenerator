name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: CLI — analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Installer les dépendances
        run: dart pub get

      - name: Analyse statique
        run: dart analyze --fatal-infos

      # Les tests d'intégration nécessitant rpm/mock/keycloak_26.tar sont
      # ignorés automatiquement (markTestSkipped) si les outils/fixtures sont
      # absents — dart test se termine avec un code 0 dans ce cas.
      - name: Tests
        run: dart test

  gui:
    name: GUI — analyse et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Installer les dépendances système (GTK, Linux desktop)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Installer les dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      # -j 1 : exécution séquentielle plutôt que par shards concurrents,
      # plus lente mais déterministe sur des runners aux ressources limitées.
      - name: Tests
        run: flutter test -j 1
