name: sbom_generator_gui
description: Interface graphique pour SBOM Generator
publish_to: 'none'
version: 1.11.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Localisation de l'interface (gen-l10n, fichiers lib/l10n/*.arb) ; la
  # version d'intl est imposée par flutter_localizations.
  flutter_localizations:
    sdk: flutter
  file_picker: ^13.1.0
  shared_preferences: ^2.3.5
  path: ^1.9.1
  url_launcher: ^6.3.1
  desktop_drop: ^0.8.4
  flutter_widget_from_html_core: ^0.17.4
  # Dépendance directe : HelpViewerScreen en extrait le texte brut du HTML
  # pré-généré, pour la recherche. tool/generate_help.dart s'appuie sur la
  # même résolution.
  html: ^0.15.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/help/manual/
    - assets/help/manual_en/
