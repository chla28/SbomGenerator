name: sbom_generator_gui
description: Interface graphique pour SBOM Generator
publish_to: 'none'
version: 1.6.2+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Localisation de l'interface (gen-l10n, fichiers lib/l10n/*.arb) ; la
  # version d'intl est imposée par flutter_localizations.
  flutter_localizations:
    sdk: flutter
  intl: any
  file_picker: ^11.0.2
  shared_preferences: ^2.3.5
  path: ^1.9.1
  url_launcher: ^6.3.1
  desktop_drop: ^0.7.1
  flutter_html: ^3.0.0
  # Dépendance directe (utilisée aussi par HelpViewerScreen pour extraire le
  # texte brut du HTML pré-généré, pour la recherche) — épinglée à 0.15.5
  # exactement : flutter_html 3.0.0 importe une API interne (package:html/
  # src/query_selector.dart) qui a changé de forme en 0.15.6+, provoquant
  # une erreur de compilation ("Method not found: 'matches'") au-delà de
  # cette version — vérifié empiriquement, à réévaluer si flutter_html est
  # mis à jour. tool/generate_help.dart s'appuie sur la même résolution.
  html: 0.15.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/help/manual/
    - assets/help/manual_en/
