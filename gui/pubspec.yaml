name: sbom_generator_gui
description: Interface graphique pour SBOM Generator
publish_to: 'none'
version: 1.3.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^11.0.2
  shared_preferences: ^2.3.5
  path: ^1.9.1
  url_launcher: ^6.3.1
  desktop_drop: ^0.7.1
  flutter_html: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Épinglé : flutter_html 3.0.0 importe une API interne (package:html/
  # src/query_selector.dart) qui a changé de forme en 0.15.6+, provoquant
  # une erreur de compilation ("Method not found: 'matches'") au-delà de
  # 0.15.5 — vérifié empiriquement, à réévaluer si flutter_html est mis à
  # jour.
  html: 0.15.5

flutter:
  uses-material-design: true
  assets:
    - assets/help/manual/
