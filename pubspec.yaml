name: sbom_generator
description: >
  Generates SBOM (Software Bill of Materials) from a list of RPM packages.
  Supports CycloneDX 1.6/1.7, SPDX 2.3, and custom JSON output formats.
  Includes dependency relationships resolved via rpm requires/provides.
version: 1.5.8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  args: ^2.4.2
  crypto: ^3.0.0
dev_dependencies:
  test: ^1.31.1
