name: sbom_generator
description: >
  Generates SBOMs (Software Bill of Materials) from packages, archives,
  lockfiles, container images or binaries (CycloneDX 1.6/1.7, SPDX 2.3/3.0,
  JSON, Markdown, AsciiDoc, HTML, CSV), with diff, merge, convert, validate,
  licenses, scan (CVE) and cra (Cyber Resilience Act) subcommands.
version: 1.6.5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  args: ^2.4.2
  crypto: ^3.0.0
dev_dependencies:
  test: ^1.31.1
